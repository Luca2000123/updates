id = "com.luca2000123.mystreaming"
title = "MyStreaming"
description = "Client di streaming per Android, Windows e TV LG webOS."
icon = "https://luca2000123.github.io/updates/icons/com.luca2000123.mystreaming.png"
source_repo = "Luca2000123/MyStreaming"
release_repo = "Luca2000123/updates"
tag_prefix = "mystreaming"

[targets.android-all]
ext = "apk"
install = "apk"

[targets.windows-x86_64]
ext = "zip"
install = "zip-relay"

[targets.webos-all]
ext = "ipk"
install = "ipk-manual"

[webos]
type = "web"
rootRequired = false
