id = "com.luca2000123.mystreaming"
title = "MyStreaming"
description = "Client di streaming per Android, Windows e TV LG webOS."
icon = "https://firebasestorage.googleapis.com/v0/b/mystreaming-e09a9.firebasestorage.app/o/icons%2Fcom.luca2000123.mystreaming.png?alt=media"
source_repo = "Luca2000123/MyStreaming"
release_repo = "Luca2000123/updates"
tag_prefix = "mystreaming"

[firebase]
bucket = "mystreaming-e09a9.firebasestorage.app"

[targets.android-all]
ext = "apk"
install = "apk"

[targets.windows-x86_64]
ext = "zip"
install = "zip-relay"

[targets.webos-all]
ext = "ipk"
install = "ipk-manual"

[webos]
type = "web"
rootRequired = false
