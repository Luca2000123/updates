name: build-site

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - releases/**
      - schema/**
      - static/**
      - tools/**
      - hub.toml
      - .github/workflows/build-site.yml
  pull_request:
    paths:
      - apps/**
      - releases/**
      - schema/**
      - tools/**
      - hub.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install --disable-pip-version-check jsonschema

      - name: Test del generatore
        run: python tools/test_hub.py

      - name: Genera il sito
        run: python tools/build_manifests.py --out site --strict

      - name: Valida i manifest contro lo schema
        run: python tools/validate_site.py --site site

      - name: Autenticazione Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Repo privato, niente Pages: i manifest e le icone vanno dritti sul
      # bucket Firebase Storage dell'app (dietro autenticazione, vedi
      # storage.rules in MyStreaming). Un solo bucket per ora -- l'unica app
      # con [firebase] configurato e' com.luca2000123.mystreaming; quando
      # un'altra ne avra' uno proprio, questo step va reso per-app invece
      # che fisso su un bucket solo.
      - name: Carica manifest e icone sul bucket
        if: github.event_name != 'pull_request'
        run: |
          BUCKET=mystreaming-e09a9.firebasestorage.app
          gcloud storage rsync site/v1 "gs://${BUCKET}/v1" \
            --recursive --delete-unmatched-destination-objects
          gcloud storage rsync static/icons "gs://${BUCKET}/icons" \
            --recursive --delete-unmatched-destination-objects
