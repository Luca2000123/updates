name: build-site

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - releases/**
      - schema/**
      - static/**
      - tools/**
      - hub.toml
      - .github/workflows/build-site.yml
  pull_request:
    paths:
      - apps/**
      - releases/**
      - schema/**
      - tools/**
      - hub.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install --disable-pip-version-check jsonschema

      - name: Test del generatore
        run: python tools/test_hub.py

      - name: Genera il sito
        run: python tools/build_manifests.py --out site --strict

      - name: Valida i manifest contro lo schema
        run: python tools/validate_site.py --site site

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
